<?xml-stylesheet href="../assets/xsltforms/xsltforms.xsl" type="text/xsl"?><html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ahn="http://ahn2026/ns/1.0"
      xmlns:ev="http://www.w3.org/2001/xml-events"
      xmlns:file="http://expath.org/ns/file"
      xmlns:tei="http://www.tei-c.org/ns/1.0"
      xmlns:x="http://www.w3.org/1999/xhtml"
      xmlns:xf="http://www.w3.org/2002/xforms"
      xmlns:xlink="http://www.w3.org/1999/xlink"
      xmlns:xs="http://www.w3.org/2001/XMLSchema"
      xf:bogus="fix/Firefox/namespace/issue"
      xs:bogus="fix/Firefox/namespace/issue"
      xlink:bogus="fix/Firefox/namespace/issue"
      ahn:bogus="fix/Firefox/namespace/issue"
      tei:bogus="fix/Firefox/namespace/issue"
      lang="fr">
   <head>
      <meta charset="utf-8"/>
      <title>AHN 2026Formation XForms</title>
      <link rel="stylesheet" href="../assets/css/main.css" type="text/css"/>
      <link rel="stylesheet" href="../assets/css/tei.css" type="text/css"/>
      <link rel="stylesheet"
            href="//unpkg.com/@catppuccin/highlightjs@1.0.1/css/catppuccin-latte.css"/>
      <script src="//cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js">/**/</script>
      <script src="../assets/js/generateid.js"/>
      <xf:model xmlns="http://www.tei-c.org/ns/1.0">
         <xf:instance>
            <person xmlns="">
               <name>Victor Hugo</name>
               <birthDate>1802</birthDate>
               <deathDate>1885</deathDate>
               <age/>
            </person>
         </xf:instance>
         <xf:bind nodeset="birthDate|deathDate|age" type="integer"/>
         <xf:bind nodeset="name" readonly="true()"/>
         <xf:bind nodeset="age" calculate="../deathDate - ../birthDate"/>
      </xf:model>
   </head>
   <body>
      <main class="slide ">
         <h1 class="">Valeurs calculées - <code>@calculate</code>
         </h1>
         <p>Il est possible de spécifier qu’une valeur dépend d’une ou plusieurs autres valeurs. Dès que l’une de ces valeurs change, la valeur <strong>calculée</strong> est alors automatiquement mise à jour :</p>
         <pre>
            <code class="language-xml">
&lt;xf:instance&gt;
    &lt;person xmlns=""&gt;
        &lt;name&gt;Victor Hugo&lt;/name&gt;
        &lt;birthDate&gt;1802&lt;/birthDate&gt;
        &lt;deathDate&gt;1885&lt;/deathDate&gt;
        &lt;age/&gt;
    &lt;/person&gt;
&lt;/xf:instance&gt;
                        </code>
         </pre>
         <p>À partir des dates de naissance et de mort, il devient très facile de déterminer l’age d’une personne par exemple :</p>
         <pre>
            <code class="language-xml">
&lt;xf:bind nodeset="age" calculate="../deathDate - ../birthDate"/&gt;
                        </code>
         </pre>
         <xf:group xmlns="http://www.tei-c.org/ns/1.0">
            <xf:input ref="birthDate" incremental="true">
               <xf:label>Année de naissance</xf:label>
            </xf:input>
            <x:br/>
            <xf:input ref="deathDate" incremental="true">
               <xf:label>Année de décès</xf:label>
            </xf:input>
            <x:br/>
            <xf:input ref="age">
               <xf:label>Âge</xf:label>
            </xf:input>
         </xf:group>
         <p>Sur l’élément <code>xf:bind</code>, l’attribut <code>@nodeset</code> établit un contexte pour <code>@calculate</code>.</p>
         <p>On n’est bien évidemment pas limité aux calculs arithmétiques, toutes les fonctions XPath peuvent être utilisées : <code>concat()</code>, <code>substring()</code>, etc.</p>
      </main>
      <script>hljs.highlightAll();</script>
   </body>
</html>
