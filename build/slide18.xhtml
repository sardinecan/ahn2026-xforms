   <body>
      <main class="slide ">
         <h1 class="">
            <code>current()</code>
         </h1>
         <p>La fonction <code>current()</code> renvoie le nœud du contexte (par exemple l’item d’un repeat). Cette fonction est très utile pour écrire des expressions avec imbrication des contextes.</p>
         <pre>
            <code class="language-">
&lt;xf:instance id="museum"&gt;
    &lt;museum xmlns=""&gt;
        &lt;artists&gt;
            &lt;artist id="a1"&gt;&lt;name&gt;Artemisia Gentileschi&lt;/name&gt;&lt;/artist&gt;
            &lt;artist id="a2"&gt;&lt;name&gt;Goya&lt;/name&gt;&lt;/artist&gt;
        &lt;/artists&gt;
        &lt;artworks&gt;
            &lt;artwork artist="a1"&gt;&lt;title&gt;Judith décapitant Holopherne&lt;/title&gt;&lt;/artwork&gt;
            &lt;artwork artist="a2"&gt;&lt;title&gt;El tres de mayo de 1808 en Madrid&lt;/title&gt;&lt;/artwork&gt;
            &lt;artwork artist="a2"&gt;&lt;title&gt;Saturne dévorant un de ses fils&lt;/title&gt;&lt;/artwork&gt;
        &lt;/artworks&gt;
    &lt;/museum&gt;
&lt;/xf:instance&gt;

&lt;xf:repeat nodeset="instance('museum')/artists/artist"&gt;
    &lt;xf:output value="concat(
        name,
        ', nombre d’oeuvres dans la collection : ',
        count(instance('museum')/artworks/artwork[@artist = current()/@id]))"/&gt;
&lt;/xf:repeat&gt;</code>
         </pre>
         <xf:group xmlns="http://www.tei-c.org/ns/1.0">
            <xf:repeat nodeset="instance('museum')/artists/artist">
               <xf:output value="concat(                                     name,                                     ', nombre d’oeuvres dans la collection : ',                                     count(instance('museum')/artworks/artwork[@artist = current()/@id]))"/>
            </xf:repeat>
         </xf:group>
         <ul>
            <li>Le <code>xf:repeat</code> parcourt les artistes</li>
            <li>
               <code>current()</code> désigne l’artiste de la ligne en cours</li>
            <li>On peut alors compter les oeuvres dont l’attribut <code>@artist</code> correspond à l’artiste courant</li>
         </ul>
         <p>Sans <code>current()</code>, la comparaison perdrait le bon contexte.</p>
