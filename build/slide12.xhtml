      <main class="slide ">
         <h1 class="">Champ texte (et pas uniquement) - <code>xf:input</code> &amp; <code>xf:textarea</code>
         </h1>
         <p>Avec XForms, on parle plutôt de <strong>contrôles</strong> que de champs de formulaire.</p>
         <p>Le contrôle <code>xf:input</code> correspond, globalement, au champ texte. Ce type de contrôle est placé dans le corps du document XHTML (<code>body</code>). On le relie à un nœud d’une instance par l’intermédiaire d’un attribut <code>@ref</code> et d’une expression XPath.</p>
         <pre>
            <code class="language-xml">
&lt;xf:input ref="nom"&gt;
    &lt;xf:label&gt;Nom de famille&lt;/xf:label&gt;
&lt;/xf:input&gt;
&lt;xf:input ref="dateNaissance"&gt;
    &lt;xf:label&gt;Date de naissance&lt;/xf:label&gt;
&lt;/xf:input&gt;
                        </code>
         </pre>
         <xf:group xmlns="http://www.tei-c.org/ns/1.0">
            <xf:output value="serialize(.)"/>
            <x:br/>
            <xf:input ref="nom">
               <xf:label>Nom de famille</xf:label>
            </xf:input>
            <x:br/>
            <xf:input ref="dateNaissance">
               <xf:label>Date de naissance</xf:label>
            </xf:input>
         </xf:group>
         <p>Par défaut, un champ met à jour l’instance lorsqu’on le quitte, mais ce comportement peut être modifié avec l’utilisation de l'attribut <code>@incremental="true"</code>. L’instance se mettra à jour au fur et à mesure que l’on frappe sur son clavier :</p>
         <pre>
            <code class="language-xml">
&lt;xf:input ref="nom" incremental="true"&gt;
    &lt;xf:label&gt;Nom de famille&lt;/xf:label&gt;
&lt;/xf:input&gt;
&lt;xf:input ref="dateNaissance" incremental="true"&gt;
    &lt;xf:label&gt;Date de naissance&lt;/xf:label&gt;
&lt;/xf:input&gt;
                        </code>
         </pre>
         <xf:group xmlns="http://www.tei-c.org/ns/1.0">
            <xf:output value="serialize(.)"/>
            <x:br/>
            <xf:input ref="nom" incremental="true">
               <xf:label>Nom de famille</xf:label>
            </xf:input>
            <x:br/>
            <xf:input ref="dateNaissance" incremental="true">
               <xf:label>Date de naissance</xf:label>
            </xf:input>
         </xf:group>
         <p>Pour les zones de texte plus importantes, on utilisera l’élément <code>xf:textarea</code> de la même manière :</p>
         <pre>
            <code class="language-xml">
&lt;xf:textarea ref="biographie" incremental="true"&gt;
    &lt;xf:label&gt;Biographie&lt;/xf:label&gt;
&lt;/xf:textarea&gt;
                        </code>
         </pre>
         <xf:group xmlns="http://www.tei-c.org/ns/1.0">
            <xf:textarea ref="biographie" incremental="true">
               <xf:label>Biographie</xf:label>
            </xf:textarea>
         </xf:group>
