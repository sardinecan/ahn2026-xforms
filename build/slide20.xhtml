   <body>
      <main class="slide ">
         <h1 class="">Les éléments <code>xf:select</code> et <code>xf:select1</code>
         </h1>
         <p>Ces deux éléments permettent de proposer à l’utilisateur de choisir parmi un ensemble de valeurs prédéfinies :</p>
         <ul>
            <li>
               <code>xf:select</code> : choix multiple</li>
            <li>
               <code>xf:select1</code> : choix unique</li>
         </ul>
         <p>Concernant leur mise en place, <code>xf:select</code> et <code>xf:select1</code> sont tout-à-fait similaires :</p>
         <pre>
            <code class="language-xml">
&lt;xf:select1 ref="date[1]/@type"&gt;
    &lt;xf:label&gt;Type de date&lt;/xf:label&gt;
    &lt;xf:item&gt;
        &lt;xf:label&gt;Naissance&lt;/xf:label&gt;
        &lt;xf:value&gt;birth&lt;/xf:value&gt;
    &lt;/xf:item&gt;
    &lt;xf:item&gt;
        &lt;xf:label&gt;Décès&lt;/xf:label&gt;
        &lt;xf:value&gt;death&lt;/xf:value&gt;
    &lt;/xf:item&gt;
&lt;/xf:select1&gt;
                        </code>
         </pre>
         <p>Chaque item de la liste est placé dans un élément <code>xf:item</code> comprenant un label (<code>xf:label</code>) et une valeur (<code>xf:value</code>) qui sera insérée dans l’instance. Dans le cas d’un champ à choix multiple, une <strong>espace</strong> est utilisée comme séparateur entre les valeurs… qui ne doivent donc pas en contenir !</p>
         <p>Ces champs peuvent s’afficher de 3 manières différentes :</p>
         <pre>
            <code class="language-xml">
&lt;xf:select1 ref="result" appearance="full"/&gt;
&lt;xf:select1 ref="result" appearance="compact"/&gt;
&lt;xf:select1 ref="result" appearance="minimal"/&gt;
                        </code>
         </pre>
         <xf:group xmlns="http://www.tei-c.org/ns/1.0">
            <xf:select1 ref="date[1]/@type" appearance="minimal">
               <xf:label>Type de date</xf:label>
               <xf:item>
                  <xf:label>Naissance</xf:label>
                  <xf:value>birth</xf:value>
               </xf:item>
               <xf:item>
                  <xf:label>Décès</xf:label>
                  <xf:value>death</xf:value>
               </xf:item>
            </xf:select1>
            <xf:select1 ref="date[1]/@type" appearance="compact">
               <xf:label>Type de date</xf:label>
               <xf:item>
                  <xf:label>Naissance</xf:label>
                  <xf:value>birth</xf:value>
               </xf:item>
               <xf:item>
                  <xf:label>Décès</xf:label>
                  <xf:value>death</xf:value>
               </xf:item>
            </xf:select1>
            <xf:select1 ref="date[1]/@type" appearance="full">
               <xf:label>Type de date</xf:label>
               <xf:item>
                  <xf:label>Naissance</xf:label>
                  <xf:value>birth</xf:value>
               </xf:item>
               <xf:item>
                  <xf:label>Décès</xf:label>
                  <xf:value>death</xf:value>
               </xf:item>
            </xf:select1>
         </xf:group>
