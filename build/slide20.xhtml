   <body>
      <main class="slide ">
         <h1 class="">Les boutons (<code>xf:trigger</code>)</h1>
         <p>Un <code>xf:trigger</code> est un bouton qui déclenche un évènement <code>DOMActivate</code> lorsque l’on clique dessus.</p>
         <pre>
            <code class="language-xml">
&lt;xf:instance&gt;
    &lt;data xmlns=""&gt;
        &lt;counter&gt;0&lt;/counter&gt;
    &lt;/data&gt;
&lt;/xf:instance&gt;
[…]
&lt;xf:trigger&gt;
    &lt;xf:label&gt;+ 1&lt;/xf:label&gt;
    &lt;xf:action ev:event="DOMActivate"&gt;
        &lt;xf:setvalue ref="counter" value=". + 1"/&gt;
    &lt;/xf:action&gt;
&lt;/xf:trigger&gt;
                        </code>
         </pre>
         <xf:group xmlns="http://www.tei-c.org/ns/1.0">
            <xf:trigger>
               <xf:label>+ 1</xf:label>
               <xf:action ev:event="DOMActivate">
                  <xf:setvalue ref="counter" value=". + 1"/>
               </xf:action>
            </xf:trigger>
            <x:br/>
            <xf:output ref="counter">
               <xf:label>Nombre de clics : </xf:label>
            </xf:output>
         </xf:group>
         <p>Mais on peut s’en servir pour plein d’autres de choses, par exemple, avec <code>xf:load</code> on peut mimer des liens hypertextes :</p>
         <pre>
            <code class="language-xml">
&lt;xf:trigger&gt;
    &lt;xf:label&gt;There is no dark side of the moon!&lt;/xf:label&gt;
    &lt;xf:action ev:event="DOMActivate"&gt;
        &lt;xf:load resource="https://images.nasa.gov/details/art002e009287" show="new"/&gt;
    &lt;/xf:action&gt;
&lt;/xf:trigger&gt;
                        </code>
         </pre>
         <xf:trigger xmlns="http://www.tei-c.org/ns/1.0">
            <xf:label>There is no dark side of the moon!</xf:label>
            <xf:action ev:event="DOMActivate">
               <xf:load resource="https://images.nasa.gov/details/art002e009287" show="new"/>
            </xf:action>
         </xf:trigger>
         <p>Par défaut, la ressource est chargée dans la fenêtre courante, sauf si on utilise l’attribut <code>@show="new"</code>.</p>
         <p>L'attribut <code>@appearance</code> permet de changer la manière dont est représenté le bouton.</p>
         <pre>
            <code class="language-xml">
&lt;xf:trigger appearance="minimal"&gt;
    &lt;xf:label&gt;There is no dark side of the moon!&lt;/xf:label&gt;
    &lt;xf:action ev:event="DOMActivate"&gt;
        &lt;xf:load resource="https://images.nasa.gov/details/art002e009287" show="new"/&gt;
    &lt;/xf:action&gt;
&lt;/xf:trigger&gt;
                        </code>
         </pre>
         <xf:group xmlns="http://www.tei-c.org/ns/1.0">
            <xf:trigger appearance="minimal">
               <xf:label>There is no dark side of the moon!</xf:label>
               <xf:action ev:event="DOMActivate">
                  <xf:load resource="https://images.nasa.gov/details/art002e009287" show="new"/>
               </xf:action>
            </xf:trigger>
         </xf:group>
         <p>Si l’url doit être construite à partir des données du formulaire, l’attribut <code>@source</code> peut être remplacé par l’élément <code>xf:resource</code> :</p>
         <pre>
            <code class="language-">
&lt;xf:instance id="urlParam"&gt;
    &lt;data xmlns=""&gt;
        &lt;q&gt;art002e009287&lt;/q&gt;
    &lt;/data&gt;
&lt;/xf:instance&gt;

&lt;xf:load show="new"&gt;
    &lt;xf:resource value="concat('https://images.nasa.gov/details/',instance('urlParam')/q)"/&gt;
&lt;/xf:load&gt;
                        </code>
         </pre>
         <xf:group xmlns="http://www.tei-c.org/ns/1.0">
            <xf:trigger>
               <xf:label>There is still no dark side of the moon!</xf:label>
               <xf:load show="new" ev:event="DOMActivate">
                  <xf:resource value="concat('https://images.nasa.gov/details/', instance('urlParam')/q)"/>
               </xf:load>
            </xf:trigger>
         </xf:group>
