<?xml-stylesheet href="../assets/xsltforms/xsltforms.xsl" type="text/xsl"?><html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ahn="http://ahn2026/ns/1.0"
      xmlns:ev="http://www.w3.org/2001/xml-events"
      xmlns:file="http://expath.org/ns/file"
      xmlns:tei="http://www.tei-c.org/ns/1.0"
      xmlns:x="http://www.w3.org/1999/xhtml"
      xmlns:xf="http://www.w3.org/2002/xforms"
      xmlns:xlink="http://www.w3.org/1999/xlink"
      xmlns:xs="http://www.w3.org/2001/XMLSchema"
      xf:bogus="fix/Firefox/namespace/issue"
      xs:bogus="fix/Firefox/namespace/issue"
      xlink:bogus="fix/Firefox/namespace/issue"
      ahn:bogus="fix/Firefox/namespace/issue"
      tei:bogus="fix/Firefox/namespace/issue"
      lang="fr">
   <head>
      <meta charset="utf-8"/>
      <title>AHN 2026Formation XForms</title>
      <link rel="stylesheet" href="../assets/css/main.css" type="text/css"/>
      <link rel="stylesheet" href="../assets/css/tei.css" type="text/css"/>
      <link rel="stylesheet"
            href="//unpkg.com/@catppuccin/highlightjs@1.0.1/css/catppuccin-latte.css"/>
      <script src="//cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js">/**/</script>
      <script src="../assets/js/generateid.js"/>
      <xf:model xmlns="http://www.tei-c.org/ns/1.0">
         <xf:instance>
            <data xmlns="">
               <nom/>
               <dateNaissance/>
               <age/>
            </data>
         </xf:instance>
         <xf:bind nodeset="age" type="integer"/>
         <xf:bind nodeset="dateNaissance" type="date"/>
      </xf:model>
   </head>
   <body>
      <main class="slide ">
         <h1 class="">Les instances de données (<code>xf:instance</code>)</h1>
         <p>L’élément <a href="https://www.w3.org/TR/xforms11/#structure-model" target="_blank">
               <code>xf:model</code>
            </a> peut contenir une ou plusieurs instances XML (<a href="https://www.w3.org/TR/xforms11/#structure-model-instance"
               target="_blank">
               <code>xf:instance</code>
            </a>) :</p>
         <pre>
            <code class="language-xml">
&lt;html&gt;
    &lt;head&gt;
        &lt;xf:model&gt;
            &lt;xf:instance&gt;
                &lt;data xmlns=""&gt;
                    &lt;nom/&gt;
                    &lt;dateNaissance/&gt;
                    &lt;age/&gt;
                &lt;/data&gt;
            &lt;/xf:instance&gt;
        &lt;/xf:model&gt;
    &lt;/head&gt;
    &lt;body/&gt;
&lt;html&gt;
                        </code>
         </pre>
         <p>Les instances peuvent être déclarées directement dans le modèle, comme nous venons de le voir, ou bien être issues de ressources externes (fichier local ou en ligne) à l'aide de l'attribut <code>@src</code> :</p>
         <pre>
            <code class="language-xml">
&lt;xf:instance src="victorHugo.xml"/&gt;
&lt;xf:instance src="https://experts.huma-num.fr/xpr/biographies/xpr0027"/&gt;
                        </code>
         </pre>
         <p>Il est impératif d’associer un espace de nom, même vide, aux instances sous peine de les voir interprétées comme des éléments XHTML.</p>
         <p>Pour éviter les bugs avec Firefox (qui ne prend pas bien en charge les espaces de nom…), il convient de procéder avec <code>*:bogus</code> :</p>
         <pre>
            <code class="language-xml">
&lt;html xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ev="http://www.w3.org/2001/xml-events"
    xmlns:xf="http://www.w3.org/2002/xforms"
    xmlns:tei="http://www.tei-c.org/ns/1.0"
    xf:bogus="fix/Firefox/namespace/issue"
    xs:bogus="fix/Firefox/namespace/issue"
    tei:bogus="fix/Firefox/namespace/issue"/&gt;</code>
         </pre>
      </main>
      <script>hljs.highlightAll();</script>
   </body>
</html>
