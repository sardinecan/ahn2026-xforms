<?xml-stylesheet href="../assets/xsltforms/xsltforms.xsl" type="text/xsl"?><html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ahn="http://ahn2026/ns/1.0"
      xmlns:ev="http://www.w3.org/2001/xml-events"
      xmlns:file="http://expath.org/ns/file"
      xmlns:tei="http://www.tei-c.org/ns/1.0"
      xmlns:x="http://www.w3.org/1999/xhtml"
      xmlns:xf="http://www.w3.org/2002/xforms"
      xmlns:xlink="http://www.w3.org/1999/xlink"
      xmlns:xs="http://www.w3.org/2001/XMLSchema"
      xf:bogus="fix/Firefox/namespace/issue"
      xs:bogus="fix/Firefox/namespace/issue"
      xlink:bogus="fix/Firefox/namespace/issue"
      ahn:bogus="fix/Firefox/namespace/issue"
      tei:bogus="fix/Firefox/namespace/issue"
      lang="fr">
   <head>
      <meta charset="utf-8"/>
      <title>AHN 2026Formation XForms</title>
      <link rel="stylesheet" href="../assets/css/main.css" type="text/css"/>
      <link rel="stylesheet" href="../assets/css/tei.css" type="text/css"/>
      <link rel="stylesheet"
            href="//unpkg.com/@catppuccin/highlightjs@1.0.1/css/catppuccin-latte.css"/>
      <script src="//cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js">/**/</script>
      <script src="../assets/js/generateid.js"/>
      <xf:model xmlns="http://www.tei-c.org/ns/1.0" id="M">
         <xf:instance>
            <data xmlns="">
               <time/>
            </data>
         </xf:instance>
         <xf:dispatch ev:event="xforms-ready" name="TICK" targetid="M"/>
         <xf:action ev:event="TICK">
            <xf:setvalue ref="time" value="local-dateTime()"/>
            <xf:dispatch name="TICK" targetid="M" delay="1000"/>
         </xf:action>
      </xf:model>
   </head>
   <body>
      <main class="slide ">
         <h1 class="">Événements personnalisés - <code>xf:dispatch</code>
         </h1>
         <p>Nous avons parlé de la façon dont XForms distribue des événements à différents moments. Il est également possible de distribuer et capturer vos propres événements. Vous les distribuez avec l'action <code>&lt;dispatch&gt;</code> vers un élément avec un id particulier :</p>
         <pre>
            <code class="language-xml">
&lt;xf:dispatch name="SAVE" targetid="element"/&gt;
                        </code>
         </pre>
         <p>et les capturez de la manière habituelle.</p>
         <p>Par exemple, s'il y a plusieurs endroits dans un XForm où vous capturez un événement et effectuez la même action, vous pourriez à la place distribuer votre propre événement vers un endroit pour gérer l'événement.</p>
         <p>Un bon exemple est la capture des changements dans une instance, qui comme vous le savez peuvent être signalés par les événements <code>xforms-insert</code>, <code>xforms-delete</code> et <code>xforms-value-changed</code>.</p>
         <p>Donc vous pouvez faire :</p>
         <pre>
            <code class="language-xml">
&lt;xf:dispatch name="CHANGE" targetid="M" ev:event="xforms-insert"/&gt;
&lt;xf:dispatch name="CHANGE" targetid="M" ev:event="xforms-delete"/&gt;
&lt;xf:dispatch name="CHANGE" targetid="M" ev:event="xforms-value-changed"/&gt;
                        </code>
         </pre>
         <p>et ensuite le capturer dans le modèle avec l'id M :</p>
         <pre>
            <code class="language-xml">
&lt;xf:model id="M"&gt;
    ...
    &lt;xf:action ev:event="CHANGE"&gt;
        ...
    &lt;/xf:action&gt;
&lt;/xf:model&gt;
                        </code>
         </pre>
         <div>
            <h2 class="">Dispatches différés</h2>
            <p>Il est possible de distribuer un événement avec un délai, mesuré en millisecondes :</p>
            <pre>
               <code class="language-xml">
&lt;xf:dispatch name="SAVE" targetid="M" delay="10000"/&gt;
                            </code>
            </pre>
            <p>qui distribuera l'événement SAVE après 10 secondes. Par exemple, supposons que nous voulions faire une horloge. Au démarrage, nous envoyons un événement TICK :</p>
            <pre>
               <code class="language-xml">
&lt;xf:action ev:event="xforms-ready"&gt;
    &lt;xf:dispatch name="TICK" targetid="M"/&gt;
&lt;/xf:action&gt;
                            </code>
            </pre>
            <p>Nous répondons à cet événement en définissant une valeur à l'heure actuelle, et en distribuant un autre TICK avec un délai d'une seconde :</p>
            <pre>
               <code class="language-xml">
&lt;xf:action ev:event="TICK"&gt;
    &lt;xf:setvalue ref="time" value="local-dateTime()"/&gt;
    &lt;xf:dispatch name="TICK" targetid="M" delay="1000"/&gt;
&lt;/xf:action&gt;
                            </code>
            </pre>
            <p>Ensuite, si nous affichons la valeur time, elle se mettra à jour toutes les secondes :</p>
            <pre>
               <code class="language-xml">
&lt;xf:output ref="time"/&gt;
                            </code>
            </pre>
            <xf:group xmlns="http://www.tei-c.org/ns/1.0" class="inset">
               <xf:output ref="time">
                  <xf:label>Heure actuelle</xf:label>
               </xf:output>
            </xf:group>
         </div>
      </main>
      <script>hljs.highlightAll();</script>
   </body>
</html>
