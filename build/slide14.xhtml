      <main class="slide ">
         <h1 class="">
            <code>xf:label</code>, <code>xf:hint</code>, <code>xf:help</code> et <code>xf:alert</code>
         </h1>
         <p>Les éléments <code>xf:label</code>, <code>xf:hint</code>, <code>xf:help</code> et <code>xf:alert</code> permettent d’attacher des métadonnées à une grande partie des contrôles XForms.</p>
         <p>Ils sont utilisés comme des sous-éléments pour le contrôles <code>xf:input</code>, <code>xf:output</code>, <code>xf:group</code>, <code>xf:repeat</code>, etc.</p>
         <p>Un label facultatif peut être associé à tous les champs ou contrôles XForms avec l’élément <code>xf:label</code>
         </p>
         <pre>
            <code class="language-xml">
&lt;xf:input ref="dateNaissance" incremental="true"&gt;
    &lt;xf:label&gt;Date de naissance&lt;/xf:label&gt;
    &lt;xf:help&gt;Date au format AAAA&lt;/xf:help&gt;
    &lt;xf:hint&gt;Année de naissance de VH&lt;/xf:hint&gt;
&lt;/xf:input&gt;
                        </code>
         </pre>
         <xf:group xmlns="http://www.tei-c.org/ns/1.0">
            <xf:input ref="dateNaissance" incremental="true">
               <xf:label>Date de naissance</xf:label>
               <xf:help>Date au format AAAA</xf:help>
               <xf:hint>Année de naissance de VH</xf:hint>
            </xf:input>
         </xf:group>
         <p>On peut y placer directement du texte ou charger du contenu depuis une instance de données en utilisant l'attribut <code>@ref</code>.</p>
      </main>
