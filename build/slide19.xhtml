      <main class="slide ">
         <h1 class="">Multiples instances</h1>
         <p>Il est possible de déclarer plusieurs instances au sein d’un même modèle. Dans ce cas, il est nécessaire de leur attribuer un identifiant à l’aide d’un attribut <code>@id</code>.</p>
         <pre>
            <code class="language-xml">
&lt;xf:instance id="listPerson" resource="listPerson.xml"/&gt;
&lt;xf:instance id="search"&gt;
    &lt;search xmlns=""&gt;
        &lt;q/&gt;
    &lt;/search&gt;
&lt;/xf:instance&gt;
                        </code>
         </pre>
         <p>Pour faire référence à une instance particulière on utilise la fonction <code>instance()</code>. Cette fonction prend un unique argument : l’identifiant de l’instance.</p>
         <pre>
            <code class="language-xml">
&lt;xf:input ref="instance('search')/q"&gt;&lt;xf:label&gt;Recherche : &lt;/xf:label&gt;&lt;/xf:input&gt;
                        </code>
         </pre>
         <xf:group xmlns="http://www.tei-c.org/ns/1.0">
            <xf:input ref="instance('search')/q">
               <xf:label>Recherche</xf:label>
            </xf:input>
         </xf:group>
         <p>La première instance est l’instance par défaut, il n'est donc pas nécessaire d’utiliser la fonction <code>instance()</code> avec cette dernière.</p>
         <p>Avec ce mécanisme, il devient très facile de filtrer des nœuds au regard de la valeur d’une donnée par exemple. :</p>
         <pre>
            <code class="language-xml">
&lt;xf:repeat nodeset="person[contains(lower-case(.), lower-case(instance('search')))]"&gt;
     &lt;xf:output value="concat(name, ' (', birthDate, ' - ', deathDate, ')')"/&gt;
&lt;/xf:repeat&gt;
                        </code>
         </pre>
         <xf:group xmlns="http://www.tei-c.org/ns/1.0">
            <xf:input ref="instance('search')/q" incremental="true">
               <xf:label>Rechercher un auteur : </xf:label>
            </xf:input>
            <x:br/>
            <xf:repeat nodeset="person[contains(lower-case(.), lower-case(instance('search')))]">
               <xf:output value="concat(name, ' (', birthDate, ' - ', deathDate, ')')"/>
            </xf:repeat>
         </xf:group>
         <p>Avec ce filtre, seuls sont répétés les éléments <code>person</code> contenant le segment indiqué dans l’instance <code>search</code>
         </p>
